addr: :8081
postgres_dsn: postgres://inferbus:inferbus@postgres:5432/inferbus
nats_url: nats://localhost:4222
# oidc:
#   issuer: "[YOUR-ISSUER]"      # e.g. https://your-idp.example.com
#   audience: "[YOUR-AUDIENCE]"
platform_admins: []
bootstrap_token: dev_admin_change_me
# clickhouse_dsn enables GET /admin/v1/usage (501 without it). Optional:
# if it is set but unreachable at startup, the control plane logs a warning
# and keeps serving everything else, with the usage endpoint reporting 501.
clickhouse_dsn: "clickhouse://inferbus:inferbus@clickhouse:9000/inferbus"
