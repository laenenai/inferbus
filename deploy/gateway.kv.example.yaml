# Gateway configuration for control-plane (kv) mode — the config the
# compose stack in this directory mounts.
#
# In kv mode the gateway reads API keys and aliases live from the control
# plane's KEYS/ALIASES NATS KV buckets, and enforces monthly token budgets
# from the harvester's BUDGETS bucket (HTTP 402 once a key is exhausted).
# There is deliberately no `keys:` list here: kv mode never consults one,
# and the gateway refuses to start if both are present.
#
# The HTTP server binds immediately. Until the first scan of both KV
# buckets completes — e.g. while the control plane is still starting — GET
# /readyz and every authenticated request answer 503 (not 401), then the
# gateway serves normally. Create a key through the control plane's admin
# API (see the README quickstart) before making a request.
#
# For a control-plane-free setup with static YAML keys and aliases, use
# gateway.example.yaml instead.
addr: ":8080"
request_timeout: 5m
iam:
  mode: kv
# Embedding aliases with operator-pinned params ("named resolutions") are
# created through the control plane's admin API, not this file — kv mode's
# ALIASES entries (including their optional `params` map) live in
# Postgres/NATS KV, never in static YAML. Example: exposing one embedding
# model as two aliases that each pin their own vector size, so clients pick
# a size by alias and never send `dimensions` themselves:
#
#   curl -X PUT http://localhost:8081/admin/v1/aliases/acme/embed-hd \
#     -H "Authorization: Bearer dev_admin_change_me" \
#     -H "Content-Type: application/json" \
#     -d '{"target":"nomic-embed-text","params":{"dimensions":"1024"}}'
#
#   curl -X PUT http://localhost:8081/admin/v1/aliases/acme/embed-compact \
#     -H "Authorization: Bearer dev_admin_change_me" \
#     -H "Content-Type: application/json" \
#     -d '{"target":"nomic-embed-text","params":{"dimensions":"256"}}'
#
# See the README's "Named resolutions" section for the full walkthrough,
# including the Ollama-vs-vLLM `dimensions` support caveat.
# admission:
#   max_backlog: 32          # reject a request when the model's queue already
#                            # holds this many entries (JetStream consumer
#                            # NumPending + NumAckPending). 0 — the default,
#                            # and what you get by leaving this block
#                            # commented out — disables admission control
#                            # entirely. A rejected request gets HTTP 429 with
#                            # error.type "overloaded" and a Retry-After
#                            # header, instead of being queued behind work no
#                            # worker is going to reach in time.
#   retry_after_seconds: 2   # Retry-After value on the 429 (default 2).
#   overrides:               # per-model limits, keyed by the CONCRETE model
#     llama3.2: 8            # name (the alias target), not the alias. An
#     embed-small: 0         # override of 0 exempts that model.
#
# Backlog is read from the model's durable consumer and cached for one
# second per model, so a burst costs one JetStream lookup, not one per
# request. The check fails open: if the consumer doesn't exist yet (no
# worker has ever started for that model) or JetStream is slow to answer,
# the request is admitted rather than rejected.
