services:
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: inferbus
      POSTGRES_PASSWORD: inferbus
      POSTGRES_DB: inferbus
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inferbus"]
      interval: 5s
      timeout: 3s
      retries: 12
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: inferbus
      # The image disables network access for the 'default' user unless a
      # user/password pair is set, so the harvester (and the control
      # plane's usage reader) need these to connect at all. Dev
      # credentials, same posture as postgres above — change them for
      # anything but a local stack.
      CLICKHOUSE_USER: inferbus
      CLICKHOUSE_PASSWORD: inferbus
    ports: ["8123:8123", "9000:9000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  gateway:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["gateway", "-config", "/etc/inferbus/gateway.yaml"]
    environment: { INFERBUS_NATS_URL: nats://nats:4222 }
    volumes: ["./gateway.kv.example.yaml:/etc/inferbus/gateway.yaml:ro"]
    ports: ["8080:8080"]
    depends_on:
      nats: { condition: service_healthy }
      # The gateway ready-gates on its first KEYS/ALIASES scan, so it only
      # needs the control plane to be on its way up, not healthy.
      controlplane: { condition: service_started }
  worker:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["worker", "-config", "/etc/inferbus/worker.yaml"]
    environment: { INFERBUS_NATS_URL: nats://nats:4222 }
    volumes: ["./worker.example.yaml:/etc/inferbus/worker.yaml:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      nats: { condition: service_healthy }
  controlplane:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["controlplane", "-config", "/etc/inferbus/controlplane.yaml"]
    environment: { INFERBUS_NATS_URL: nats://nats:4222 }
    volumes: ["./controlplane.example.yaml:/etc/inferbus/controlplane.yaml:ro"]
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      # Only GET /admin/v1/usage needs ClickHouse; an unreachable one
      # degrades that endpoint to 501 rather than stopping the control
      # plane, so this dependency is convenience, not a requirement.
      clickhouse: { condition: service_healthy }
  harvester:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["harvester", "-config", "/etc/inferbus/harvester.yaml"]
    environment:
      INFERBUS_NATS_URL: nats://nats:4222
      INFERBUS_CLICKHOUSE_DSN: clickhouse://inferbus:inferbus@clickhouse:9000/inferbus
    volumes: ["./harvester.example.yaml:/etc/inferbus/harvester.yaml:ro"]
    ports: ["8082:8082"]
    depends_on:
      nats: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
