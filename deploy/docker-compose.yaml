services:
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: infbus
      POSTGRES_PASSWORD: infbus
      POSTGRES_DB: infbus
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infbus"]
      interval: 5s
      timeout: 3s
      retries: 12
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: infbus
    ports: ["8123:8123", "9000:9000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 12
