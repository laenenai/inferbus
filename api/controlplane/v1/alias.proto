syntax = "proto3";

package controlplane.v1;

option go_package = "github.com/laenenai/inferbus/api/controlplane/v1;controlplanev1";

// Alias is the aggregate state for one model/route alias.
message Alias {
  // scope and name are UNPOPULATED by this aggregate (see
  // internal/controlplane/alias/decider.go's package doc comment):
  // AliasCommand/AliasEvent carry no scope/name, only target/params —
  // scope and name come from the stream identity itself (composed via
  // alias.StreamID and split back out by
  // controlplane.SplitAliasStreamID), which is a concern for whatever
  // constructs/reads the stream id, not for this aggregate's state. Field
  // numbers 1-2 are effectively reserved: do NOT remove or renumber them.
  string scope = 1;
  string name = 2;
  string target = 3;
  map<string, string> params = 4;
  bool deleted = 5;
}

message SetAlias {
  string target = 1;
  map<string, string> params = 2;
}

message DeleteAlias {}

message AliasCommand {
  oneof kind {
    SetAlias set = 1;
    DeleteAlias delete = 2;
  }
}

message AliasSet {
  string target = 1;
  map<string, string> params = 2;
}

message AliasDeleted {}

message AliasEvent {
  oneof kind {
    AliasSet set = 1;
    AliasDeleted deleted = 2;
  }
}
